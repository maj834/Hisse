name: Tum hisseler yapay zeka

# BIST 30 dışındaki hisseler için yapay zekâ (data/ai_genis.json). Tek bir "dinleyici" iş akışı:
#  - Uygulamadaki "Yapay zekâya analiz ettir" isteklerini (ntfy.sh) 15 saniyede bir kontrol eder ve hemen değerlendirir.
#  - Borsa açıkken (07-15 UTC, hafta içi) saatte bir en popüler 100 hisseden en eski analizli 24'ünü yeniler.
# Her çalıştırma ~5 saat 45 dakika sürer; 6 saatte bir yeniden başlar, böylece sürekli açık kalır.
# Tek yazıcı olduğu için ai_genis.json'da çakışma olmaz. Anahtar: GROQ_API_KEY.
on:
  schedule:
    - cron: "2 */6 * * *"
  workflow_dispatch:
    inputs:
      test_kod:
        description: "Deneme: bu hisse kodu için uygulamadaki gibi istek gönder (boş bırak)"
        default: ""

permissions:
  contents: write
  actions: write     # bekçi: fiyat döngüsü durursa veri.yml'yi yeniden başlatır

concurrency:
  group: genis-ai
  cancel-in-progress: false

jobs:
  dinle:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet requests

      - name: deneme isteği
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_kod != '' }}
        run: curl -s -d "${{ inputs.test_kod }}" https://ntfy.sh/hisseradar-analiz-istek-7k3q && sleep 3

      - name: dinle ve değerlendir
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
          GROQ_GENIS_MODEL: ${{ vars.GROQ_GENIS_MODEL }}
          GH_TOKEN: ${{ github.token }}
          MARKET: /tmp/veri/market.json
          GECMIS: /tmp/veri/gecmis.json
          SNAPSHOT: /tmp/veri/snapshot.json
          NEWS: /tmp/veri/news.json
          EK: /tmp/veri/ek.json
          SURE_DK: "345"
        run: |
          git config user.name "hisse-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/veri
          veri_al() {
            git fetch --quiet --depth 1 origin data || return
            for f in market gecmis snapshot news ek; do
              git show origin/data:$f.json > /tmp/veri/$f.json 2>/dev/null || echo '{}' > /tmp/veri/$f.json
            done
          }
          veri_al
          BITIS=$(( $(date +%s) + SURE_DK * 60 ))
          SON_VERI=$(date +%s); SON_POPULER=""; SON_BEKCI=0
          # BEKÇİ: GitHub zamanlayıcısı bazen sabah başlatıcılarını atlıyor. Borsa açıkken (hafta içi 07:00-15:10 UTC)
          # fiyat verisi 8 dakikadan eskiyse ve çalışan/sıradaki bir "Veri güncelle" yoksa dakikalık döngüyü başlat.
          bekci() {
            local g s d son yas calisan
            g=$(date -u +%u); s=$(date -u +%H); d=$(date -u +%M)
            [ "$g" -le 5 ] || return 0
            [ $((10#$s * 60 + 10#$d)) -ge 420 ] && [ $((10#$s * 60 + 10#$d)) -le 905 ] || return 0
            git fetch --quiet --depth 1 origin data 2>/dev/null || return 0
            son=$(git log -1 --format=%ct origin/data 2>/dev/null || echo 0)
            yas=$(( $(date +%s) - son ))
            [ "$yas" -ge 480 ] || return 0
            calisan=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/veri.yml/runs?per_page=5" \
              | python3 -c "import json,sys;print(sum(r['status'] in ('in_progress','queued','waiting','pending') for r in json.load(sys.stdin).get('workflow_runs',[])))" 2>/dev/null || echo 1)
            [ "$calisan" = "0" ] || return 0
            echo "BEKÇİ: veri $((yas / 60)) dk eski ve döngü yok -> başlatılıyor"
            curl -s -o /dev/null -w "dispatch %{http_code}\n" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/veri.yml/dispatches" -d '{"ref":"main","inputs":{"mod":"dongu"}}'
          }
          while [ "$(date +%s)" -lt "$BITIS" ]; do
            git fetch --quiet --depth 1 origin main && git reset --quiet --hard origin/main
            if [ $(( $(date +%s) - SON_VERI )) -ge 300 ]; then veri_al; SON_VERI=$(date +%s); fi
            if [ $(( $(date +%s) - SON_BEKCI )) -ge 120 ]; then bekci || true; SON_BEKCI=$(date +%s); fi
            MOD=talep python scraper/genis_ai.py || true
            SAAT=$(date -u +%H); GUN=$(date -u +%u); DK=$(date -u +%M)
            if [ "$GUN" -le 5 ] && [ "$SAAT" -ge 7 ] && [ "$SAAT" -le 15 ] && [ "$DK" -ge 35 ] && [ "$SON_POPULER" != "$SAAT" ]; then
              MOD=populer python scraper/genis_ai.py || true
              SON_POPULER=$SAAT
            fi
            if ! git diff --quiet -- data/ai_genis.json 2>/dev/null || [ -n "$(git status --porcelain data/ai_genis.json)" ]; then
              git add data/ai_genis.json
              git commit --quiet -m "Tum hisseler yapay zeka $(TZ=Europe/Istanbul date '+%d.%m %H:%M')"
              git push --quiet origin HEAD:main || echo "gönderilemedi, sonraki turda yeniden denenecek"
            fi
            sleep 15
          done
