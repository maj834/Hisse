name: Fon krizi

# Fon krizi sayfası: haberler, borsa toparlanma haberleri, son durum özeti (AI/ML API; yoksa ücretsiz haber AI),
# etkilenen kurum ve fonlar -> data/fon_krizi.json. AIML_API_KEY YALNIZCA burada kullanılır.
on:
  schedule:
    - cron: "*/15 * * * *"   # 15 dakikada bir (AI/ML API en çok saatte bir çağrılır)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fon-krizi
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests curl_cffi
      - name: fon verisini al
        run: |
          git fetch --quiet --depth 1 origin data || true
          git show origin/data:funds.json > /tmp/funds.json 2>/dev/null || echo '{}' > /tmp/funds.json
      - name: güncelle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AIML_API_KEY: ${{ secrets.AIML_API_KEY }}
          FUNDS: /tmp/funds.json
        run: python scraper/fon_krizi.py
      - name: kaydet
        run: |
          git config user.name "hisse-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fon_krizi.json
          git diff --cached --quiet && exit 0
          git commit --quiet -m "Fon krizi $(TZ=Europe/Istanbul date '+%d.%m %H:%M')"
          git stash --quiet --include-untracked || true
          for i in 1 2 3; do
            git pull --quiet --rebase origin main && git push --quiet origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
