name: Ekranı derle

# Uygulama ekranı (index.html) app/app.html kaynağından üretilir ve JavaScript'i okunamaz hâle getirilir
# (kopya koruması). Karıştırma başarısız olursa hiçbir şey yayınlanmaz.
# index.html elle değiştirilirse de (ör. karıştırılmamış bir sürüm yanlışlıkla gönderilirse) yeniden üretilir.
on:
  push:
    branches: [main]
    paths: ["app/app.html", "index.html", "gizlilik.md", "tools/**", ".github/workflows/ekran.yml"]
  schedule:
    - cron: "15 3 * * *"   # günde bir: gömülü başlangıç verilerini tazeler
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ekran
  cancel-in-progress: false

jobs:
  derle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: karıştırma aracını kur
        run: cd tools && npm install --no-audit --no-fund --silent
      - name: derle ve karıştır
        run: python3 tools/build_index.py
      - name: doğrula
        run: |
          grep -q "Tüm hakları saklıdır" index.html
          ! grep -q "function secimKart" index.html
          ! grep -q "function renderOutlook" index.html
      - name: tarayıcıda dene (bozuk ekran yayınlanmasın)
        run: |
          cd tools && npm install --no-audit --no-fund --silent playwright@1.56.1 && npx playwright install --with-deps chromium >/dev/null
          cd .. && (python3 -m http.server 8765 >/dev/null 2>&1 &) && sleep 2
          node tools/ekran_test.js
      - name: kaydet
        run: |
          git config user.name "hisse-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit --quiet -m "Ekran derlendi (karıştırılmış) $(TZ=Europe/Istanbul date '+%d.%m %H:%M')"
          for i in 1 2 3; do
            git pull --quiet --rebase origin main && git push --quiet origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
