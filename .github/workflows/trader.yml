name: Sanal trader

# Kurallarla çalışan sanal al-sat botu (gerçek para yok) ve Portföyüm ekranı için hisse görüşleri -> data/trader.json
on:
  schedule:
    - cron: "40 15 * * 1-5"   # 18:40 TSİ, kapanış fiyatları oturduktan sonra
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trader
  cancel-in-progress: false

jobs:
  trader:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests curl_cffi pandas numpy
      - run: python scraper/trader.py
      - name: kaydet
        run: |
          git config user.name "hisse-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trader.json
          git diff --cached --quiet && exit 0
          git commit --quiet -m "Sanal trader $(TZ=Europe/Istanbul date '+%d.%m %H:%M')"
          for i in 1 2 3; do
            git pull --quiet --rebase origin main && git push --quiet origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
