<html lang="tr">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D1A20">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hisse Radar">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="copyright" content="© 2026 Cem Ulaş Eren. Tüm hakları saklıdır.">
<meta name="description" content="Borsa İstanbul hisseleri ve fonları için grafikler, yapay zekâ kararları, 1 hafta / 1 ay / 3 ay hedefler ve haberler.">
<title>Hisse Radar</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0D1A20;--s1:#12232A;--s2:#182C34;--s3:#20363E;--line:#213740;
  --ink:#E9EEE8;--muted:#94A6A3;--faint:#63787A;
  --blue:#D3AC62;--blue-a:rgba(211,172,98,.13);--brass:#D3AC62;--brass-ink:#1A1408;
  --up:#3DC48C;--up-a:rgba(61,196,140,.14);--down:#EE5D50;--down-a:rgba(238,93,80,.14);--hold:#8FB4D6;--hold-a:rgba(143,180,214,.14);
  --r:10px;--font:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--dar:72%;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums}
body{padding:0 0 calc(84px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
a{color:inherit}
p{margin:0}
h1,h2,h3{margin:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px}
.up{color:var(--up)}.down{color:var(--down)}.hold{color:var(--hold)}.muted{color:var(--muted)}.faint{color:var(--faint)}
.small{font-size:13px}.xs{font-size:12px}

/* üst çubuk */
.appbar{position:sticky;top:0;z-index:10;background:rgba(13,26,32,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding-top:env(safe-area-inset-top,0px)}
.appbar .in{display:flex;align-items:center;gap:12px;height:60px}
.appbar h1{font-size:21px;font-weight:800;font-stretch:var(--dar);letter-spacing:0;flex:1}
.appbar h1{white-space:nowrap;min-width:0}
.appbar .live{white-space:nowrap;flex-shrink:0;font-size:12px;padding:5px 10px}
@media (max-width:420px){.appbar .in{gap:10px}.appbar h1{font-size:17px}.appbar .live{font-size:11px;padding:4px 9px;gap:5px}}
.logo{width:30px;height:30px;border-radius:50%;background:var(--brass);box-shadow:inset 0 0 0 3px #B38E48,inset 0 0 0 5px var(--brass);display:grid;place-items:center;flex:none}
.live{cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--muted);background:none;border:1px solid var(--line);padding:6px 10px;border-radius:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.live.on i{background:var(--up);animation:beat 2s infinite}
@keyframes beat{0%{box-shadow:0 0 0 0 rgba(61,196,140,.55)}70%{box-shadow:0 0 0 8px rgba(61,196,140,0)}100%{box-shadow:0 0 0 0 rgba(61,196,140,0)}}

/* genel */
.page{display:flex;flex-direction:column;gap:14px;padding-block:6px 28px}
.card{background:var(--s1);border:0;border-radius:var(--r);padding:18px 16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-h h2{font-size:19px;font-weight:750;font-stretch:85%;letter-spacing:0}
.label{font-size:13px;font-weight:600;letter-spacing:0;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:3px 8px;border-radius:4px;white-space:nowrap}
.pill.up{background:var(--up-a)}.pill.down{background:var(--down-a)}.pill.hold{background:var(--hold-a)}.pill.n{background:var(--s3);color:var(--muted)}
.seg{display:flex;gap:2px;background:none;border:0;border-bottom:1px solid var(--line);padding:0;border-radius:0}
.seg button{flex:1;padding:10px 4px 9px;border-radius:0;font-size:14px;font-weight:600;color:var(--faint);white-space:nowrap;box-shadow:inset 0 -2px 0 transparent;margin-bottom:-1px}
.seg button[aria-pressed="true"]{background:none;color:var(--ink);box-shadow:inset 0 -2px 0 var(--brass)}
.seg.sm{border-bottom:0;gap:6px}.seg.sm button{padding:7px 4px;font-size:13px;border:1px solid var(--s3);border-radius:6px;box-shadow:none;margin:0}.seg.sm button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);box-shadow:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:8px;font-weight:700;font-size:16px;padding:0 18px;text-decoration:none}
.btn.primary{background:var(--brass);color:var(--brass-ink)}
.btn.ghost{background:none;border:1px solid var(--s3)}
.search{width:100%;background:none;border:0;border-bottom:1px solid var(--s3);border-radius:0;padding:12px 2px;font:inherit;color:var(--ink)}
.search::placeholder{color:var(--faint)}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--s3);gap:2px}
.bar i{display:block;height:100%}

/* piyasa özeti */
.sum-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sum-big{font-size:30px;font-weight:800;font-stretch:var(--dar);letter-spacing:0;line-height:1.1}
.sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.sum-grid div{background:none;border-left:1px solid var(--s3);border-radius:0;padding:2px 0 2px 12px}
.sum-grid b{display:block;font-size:22px;font-weight:750;font-stretch:var(--dar)}

/* hisse listesi */
.list{background:none;border:0;border-top:1px solid var(--line);border-radius:0;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) 76px 108px;align-items:center;gap:12px;width:100%;padding:13px 2px;text-align:left;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:1px solid var(--line)}
.row:active{background:var(--s2)}
.row .code{font-size:19px;font-weight:800;font-stretch:var(--dar);letter-spacing:.01em;line-height:1.15}
.row .name{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row svg{width:76px;height:30px;display:block}
.row .r{text-align:right}
.row .px{display:block;font-size:18px;font-weight:700;font-stretch:85%}
.row .ch{display:inline-block;margin-top:2px;font-size:13px;font-weight:700;padding:0;border-radius:0}
.ch.up,.ch.down{background:none}
.ai-dot{display:inline-block;margin-left:6px;font-size:10px;font-weight:800;padding:1px 6px;border-radius:6px;vertical-align:2px}

/* detay */
.dtop{display:flex;align-items:center;gap:8px;height:52px}
.back{display:flex;align-items:center;gap:4px;font-weight:700;color:var(--blue);padding:8px 8px 8px 0}
.dtop .sp{flex:1}
.iconbtn{width:40px;height:40px;border-radius:8px;background:none;border:1px solid var(--s3);display:grid;place-items:center;text-decoration:none}
.price-block .nm{font-size:14px;color:var(--muted)}
.price-block .big{font-size:58px;font-weight:800;font-stretch:62%;letter-spacing:-.01em;line-height:1;margin-top:4px}
.price-block .meta{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
.chart-card{padding:14px 12px 12px}
.chart-top{display:flex;gap:8px;align-items:center;padding-inline:4px}
.chart-top .seg{flex:1}
.modebtn{width:42px;height:42px;border-radius:8px;background:none;border:1px solid var(--s3);display:grid;place-items:center;flex:none}
.chart-wrap{position:relative;margin-top:12px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart-wrap svg{display:block;width:100%;height:auto}
.tip{position:absolute;top:0;transform:translateX(-50%);background:var(--ink);color:var(--bg);border:0;border-radius:4px;padding:5px 10px;font-size:13px;font-weight:700;white-space:nowrap;pointer-events:none}
.tip span{display:block;font-size:11px;font-weight:600;color:#4A5A5C}
.chart-foot{display:flex;justify-content:space-between;gap:10px;padding:10px 4px 0;font-size:12px;color:var(--faint)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:10px 4px 0}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:3px}

/* yapay zekâ kararı */
.ask{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.verdict{display:flex;align-items:center;gap:16px;padding:4px 0 14px;border-radius:0;background:none;border-bottom:1px solid var(--line)}
.verdict .v{font-size:46px;font-weight:800;font-stretch:62%;letter-spacing:.02em;min-width:74px;text-align:center;padding:4px 14px;border-radius:6px;line-height:1.05}
.v.up{background:var(--up-a)}.v.down{background:var(--down-a)}.v.hold{background:var(--hold-a)}
.votes{display:flex;gap:6px;margin-top:6px}
.votes i{width:22px;height:6px;border-radius:3px;background:var(--s3)}
.models{display:flex;flex-direction:column;margin-top:6px}
.model{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line)}
.model:last-child{border-bottom:0;padding-bottom:0}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;background:var(--s3)}
.model .mn{font-weight:700;font-size:15px}
.model .why{font-size:14px;color:var(--muted);margin-top:2px}
.model .rt{text-align:right}
.model .tg{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.note{font-size:12px;color:var(--faint);margin-top:12px}

/* hedef ölçeği */
.target-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.target-head b{font-size:32px;font-weight:800;font-stretch:var(--dar);letter-spacing:0}
.scale{position:relative;height:66px;margin:20px 6px 4px}
.scale .track{position:absolute;left:0;right:0;top:30px;height:6px;border-radius:3px;background:var(--s3)}
.scale .range{position:absolute;top:30px;height:6px;border-radius:3px}
.scale .mk{position:absolute;top:22px;width:2px;height:22px;transform:translateX(-1px);border-radius:1px}
.scale .mk span{position:absolute;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;white-space:nowrap}
.scale .now span{top:-20px;color:var(--ink)}
.scale .tgt span{top:26px;color:var(--muted)}
.src-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.src-list div{display:flex;justify-content:space-between;gap:10px;font-size:14px}

/* seviyeler ve göstergeler */
.levels{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lv{background:none;border-radius:0;padding:4px 0 4px 12px;border-left:3px solid var(--line)}
.lv .k{font-size:12px;font-weight:700;color:var(--muted)}
.lv .val{font-size:22px;font-weight:800;font-stretch:var(--dar);margin-top:2px}
.lv .s{font-size:12px;color:var(--faint)}
.lv.buy{border-left-color:var(--blue)}.lv.stop{border-left-color:var(--down)}.lv.tgt{border-left-color:var(--up)}
.kv{display:flex;flex-direction:column}
.kv div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv div:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.kv b{font-weight:700;text-align:right}
.gauge{display:inline-block;width:70px;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--up) 0 30%,var(--s3) 30% 70%,var(--down) 70%);position:relative;margin-right:10px;vertical-align:2px}
.gauge i{position:absolute;top:-4px;width:3px;height:14px;border-radius:2px;background:var(--ink)}

/* haber */
.news{display:flex;flex-direction:column}
.nw{display:block;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none}
.nw:last-child{border-bottom:0}
.nw b{display:block;font-size:15px;font-weight:700;line-height:1.4}
.nw .m{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--muted)}
.tag{font-size:12px;font-weight:700;padding:1px 6px;border-radius:3px;background:none;border:1px solid rgba(211,172,98,.5);color:var(--brass)}
.kat{font-size:12px;font-weight:700;letter-spacing:0;color:var(--hold)}

/* beklenti */
.exp{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left;background:var(--s1);border:0;border-left:3px solid var(--s3);border-radius:0 var(--r) var(--r) 0;padding:15px 16px}
.exp .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.exp .code{font-size:22px;font-weight:800;font-stretch:var(--dar);line-height:1.1}
.exp .tgtline{display:flex;justify-content:space-between;align-items:center;gap:10px;background:none;border-top:1px dashed var(--s3);border-radius:0;padding:10px 0 0;font-size:14px}
.ev{padding:14px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0;padding-bottom:0}
.ev a{text-decoration:none}
.ev b{display:block;font-size:15px;line-height:1.4}
.impacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.imp{font-size:12px;font-weight:700;padding:3px 7px;border-radius:3px}
.imp.up{background:var(--up-a)}.imp.down{background:var(--down-a)}
.cons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cons>div{background:none;border-top:2px solid var(--s3);border-radius:0;padding:10px 0 0}
.cons button{display:flex;justify-content:space-between;width:100%;padding:8px 0;font-size:14px;font-weight:700}

/* fon */
.fund{display:flex;flex-direction:column;gap:12px}

/* alt menü */
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(13,26,32,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 12px;font-size:12px;font-weight:600;color:var(--faint)}
nav button svg{width:24px;height:24px}
nav button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 2px 0 var(--brass)}
nav button[aria-selected="true"] svg{color:var(--blue)}
.flash .price-block .big,.flash .row .px{animation:fl 1.4s}
@keyframes fl{0%{color:var(--hold)}}
/* Portföyüm (Jarvis) */
.pf-not{display:flex;flex-direction:column;gap:10px}
.pf-not p{font-size:14px;line-height:1.55;padding:10px 12px;border-radius:8px;background:var(--s2);border-left:3px solid var(--s3)}
.pf-not p.pf-up{border-left-color:var(--up)}.pf-not p.pf-down{border-left-color:var(--down)}.pf-not p.pf-hold{border-left-color:var(--hold)}
.pf-not a{color:var(--brass)}
.pf-sum b{font-size:17px;white-space:nowrap}
.pf-kucuk{min-height:38px;font-size:14px;padding:0 12px}
.pf-form{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.pf-alan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pf-alan label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.pf-alan input,.pf-kod{width:100%;min-width:0;font:inherit;color:var(--ink);background:var(--s2);border:1px solid var(--s3);border-radius:8px;padding:10px}
.pf-kod{margin:12px 0;resize:vertical;font-size:13px}
.pf-iki{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pf-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;width:100%;padding:13px 2px;text-align:left;border-bottom:1px solid var(--line)}
.pf-row:active{background:var(--s2)}
.pf-row .code{font-size:19px;font-weight:800;font-stretch:var(--dar)}
.pf-row .name{display:block;font-size:13px;color:var(--muted)}
.pf-row .r{text-align:right}.pf-row .px{display:block;font-size:17px;font-weight:700}
.pf-row .bar{grid-column:1/-1;height:4px}.pf-row>.xs{grid-column:1/-1}
@media (prefers-reduced-motion:reduce){.live.on i,.flash .price-block .big,.flash .row .px{animation:none}}
.fin{display:flex;flex-direction:column;font-size:14px}
.fin>div{display:grid;grid-template-columns:minmax(0,1.4fr) 1fr .8fr .8fr;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.fin>div>*:not(:first-child){text-align:right}
.fin .fh{font-size:12px;font-weight:600;letter-spacing:0;color:var(--muted);padding-top:0}
.fin span:first-child{color:var(--muted)}
.ratios{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.ratios div{background:none;border-left:1px solid var(--s3);border-radius:0;padding:2px 0 2px 12px;display:flex;flex-direction:column}
.ratios span{font-size:12px;color:var(--muted)}.ratios b{font-size:20px;font-stretch:var(--dar)}
.frow{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow .name{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.update{display:flex;flex-direction:column;gap:2px;margin-top:10px;padding:14px 16px;border-radius:8px;background:var(--brass);color:var(--brass-ink);text-decoration:none}
.update span{font-size:13px;opacity:.9}
.star{color:var(--brass);margin-right:5px}
.favbtn{font-size:20px;color:var(--muted)}.favbtn.on{color:var(--brass)}
.nw.fav b{color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:6px;background:none;border:1px solid var(--s3);font-size:14px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.sgrid div{display:flex;flex-direction:column;gap:3px;background:none;border:0;border-left:2px solid var(--s3);border-radius:0;padding:4px 0 4px 12px}
.shead{display:block;font-size:14px;font-weight:800;color:var(--ink);letter-spacing:0;text-transform:none;margin-top:4px}
.shead i{font-style:normal;margin-right:6px}
.shead.up i{color:var(--up)}.shead.down i{color:var(--down)}
.kriz-b{display:block;width:100%;text-align:left;border:0;border-left:4px solid var(--down);border-radius:0 var(--r) var(--r) 0;background:rgba(238,93,80,.08)}
.secneden{border:0;border-left:3px solid var(--brass);border-radius:0 var(--r) var(--r) 0}
.disc{font-size:12px;color:var(--faint);text-align:center;padding:8px 12px 0}
.disc a{color:var(--muted)}
/* açılış bilgilendirmesi */
.onay{position:fixed;inset:0;z-index:50;background:rgba(5,8,12,.94);display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.onay .kutu{width:100%;max-width:520px;max-height:100%;display:flex;flex-direction:column;gap:12px;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:18px}
.onay h2{font-size:20px;font-weight:800}
.onay .yazi{overflow-y:auto;flex:1;min-height:120px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:14px;color:var(--muted);line-height:1.55}
.onay .yazi h2{font-size:16px;color:var(--ink);margin:0 0 8px}.onay .yazi h3{font-size:15px;color:var(--ink);margin:14px 0 6px}
.onay .yazi p{margin:0 0 8px}.onay .yazi ul{margin:0 0 8px;padding-left:18px}.onay .yazi li{margin-bottom:6px}.onay .yazi b{color:var(--ink)}
.onay label{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45}
.onay input[type=checkbox]{width:22px;height:22px;flex:none;margin:0;accent-color:var(--blue)}
.onay .btn[disabled]{opacity:.45}
body.kilit{overflow:hidden}
/* ================= animasyonlar ================= */
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes yukari{from{transform:translateY(12px);opacity:0}}
@keyframes solgun{from{opacity:0}}
@keyframes kay{from{transform:translateX(-100%)}to{transform:translateX(320%)}}
@keyframes cubuk{from{transform:scaleY(.08)}}
@keyframes ciz{to{stroke-dashoffset:0}}
@keyframes zipla{40%{transform:translateY(-5px)}70%{transform:translateY(1px)}}
@keyframes flUp{0%{background:rgba(61,196,140,.28)}100%{background:transparent}}
@keyframes flDn{0%{background:rgba(238,93,80,.28)}100%{background:transparent}}
@keyframes parilti{0%{background-position:-200px 0}100%{background-position:200px 0}}
/* açılış (giriş) ekranı */
.splash{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s ease,visibility .5s}
.splash.bitti{opacity:0;visibility:hidden;pointer-events:none}
.splash .lg{width:92px;height:92px;border-radius:50%;background:var(--brass);display:grid;place-items:center;box-shadow:inset 0 0 0 7px #B38E48,inset 0 0 0 11px var(--brass);animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
.splash .lg path{transform-box:fill-box;transform-origin:bottom;animation:cubuk .8s cubic-bezier(.3,1.4,.5,1) both}
.splash .lg path:nth-child(2){animation-delay:.12s}.splash .lg path:nth-child(3){animation-delay:.24s}.splash .lg path:nth-child(4){animation-delay:.36s}
.splash h1{font-size:40px;font-weight:800;font-stretch:62%;letter-spacing:0;margin-top:8px;animation:yukari .6s .35s both}
.splash p{color:var(--muted);font-size:14px;animation:yukari .6s .5s both}
.splash .yuk{width:130px;height:3px;border-radius:2px;background:var(--s3);overflow:hidden;margin-top:18px;animation:solgun .4s .7s both}
.splash .yuk i{display:block;height:100%;width:35%;border-radius:2px;background:var(--blue);animation:kay 1.1s ease-in-out infinite}
.splash small{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));font-size:11px;color:var(--faint);animation:solgun .6s .8s both}
/* sayfa geçişi */
.page.giris{animation:yukari .35s cubic-bezier(.2,.8,.2,1)}
/* liste satırları kademeli gelir (yalnızca kullanıcı filtre/arama/sekme değiştirince) */
.anim>.row,.anim>.frow,.anim>.card>.frow,.anim>.exp{animation:yukari .42s cubic-bezier(.2,.8,.2,1) both}
.anim>*:nth-child(2){animation-delay:.03s}.anim>*:nth-child(3){animation-delay:.06s}.anim>*:nth-child(4){animation-delay:.09s}
.anim>*:nth-child(5){animation-delay:.12s}.anim>*:nth-child(6){animation-delay:.15s}.anim>*:nth-child(7){animation-delay:.18s}
.anim>*:nth-child(8){animation-delay:.21s}.anim>*:nth-child(9){animation-delay:.24s}.anim>*:nth-child(n+10){animation-delay:.27s}
/* grafik çizimi */
.ciz{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:ciz 1.1s cubic-bezier(.4,0,.2,1) forwards}
.alan{animation:solgun .9s .35s both}
.nokta{animation:pop .4s 1s both;transform-box:fill-box;transform-origin:center}
/* karar kartları */
.verdict .v{animation:pop .55s cubic-bezier(.2,1.4,.4,1) both}
.votes i{animation:pop .35s both}.votes i:nth-child(2){animation-delay:.05s}.votes i:nth-child(3){animation-delay:.1s}.votes i:nth-child(4){animation-delay:.15s}.votes i:nth-child(5){animation-delay:.2s}.votes i:nth-child(n+6){animation-delay:.25s}
.models .model{animation:yukari .4s both}.models .model:nth-child(2){animation-delay:.06s}.models .model:nth-child(3){animation-delay:.12s}.models .model:nth-child(n+4){animation-delay:.18s}
/* dokunma geri bildirimi */
.btn,.chip,.seg button,.iconbtn,.modebtn,.row,.frow,.exp{transition:transform .12s ease,background-color .2s ease}
.btn:active,.chip:active,.seg button:active,.iconbtn:active,.modebtn:active{transform:scale(.95)}
.row:active,.frow:active,.exp:active{transform:scale(.985)}
.seg button{transition:background-color .25s ease,color .25s ease,transform .12s ease}
nav button[aria-selected="true"] svg{animation:zipla .45s ease}
/* fiyat değişince satır kısa süre yeşil/kırmızı parlar */
.row.fl-up{animation:flUp 1.3s ease-out}.row.fl-dn{animation:flDn 1.3s ease-out}
/* yüklenirken iskelet */
.iskelet{height:64px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,var(--s1) 0,var(--s2) 50%,var(--s1) 100%) no-repeat;background-size:400px 100%;animation:parilti 1.2s linear infinite}
.onay .kutu{animation:yukari .45s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important}.ciz{stroke-dasharray:none}}

<template id="yasal-metin"><h2>Hisse Radar — Gizlilik Politikası ve Yasal Bilgilendirme</h2><p>Son güncelleme: 29 Eylül 2026</p><p>Hisse Radar, Borsa İstanbul hisseleri ve TEFAS yatırım fonları hakkında herkese açık piyasa verilerini, haber başlıklarını ve yapay zekâ ile formüllerle üretilmiş değerlendirmeleri gösteren ücretsiz bir mobil uygulamadır. Uygulamayı kullanarak aşağıdaki koşulları kabul etmiş olursunuz.</p><h3>1. Yatırım tavsiyesi değildir</h3><ul><li>Uygulamada yer alan AL / TUT / SAT kararları, hedef fiyatlar, beklenen getiriler, beklentiler, puanlar ve yorumlar <b>yatırım danışmanlığı kapsamında değildir</b> ve kimseye bir menkul kıymeti ya da fonu almayı, satmayı veya tutmayı tavsiye etmez.</li><li>Yatırım danışmanlığı hizmeti; aracı kurumlar, portföy yönetim şirketleri, mevduat kabul etmeyen bankalar ile müşteri arasında imzalanacak yatırım danışmanlığı sözleşmesi çerçevesinde sunulmaktadır. Burada yer alan yorum ve değerlendirmeler ise genel niteliktedir; mali durumunuz ile risk ve getiri tercihlerinize uygun olmayabilir. Bu nedenle, yalnızca burada yer alan bilgilere dayanılarak yatırım kararı verilmesi beklentilerinize uygun sonuçlar doğurmayabilir.</li><li>Değerlendirmeler otomatik olarak üretilir: yapay zekâ modelleri (ör. Groq üzerinden açık kaynak modeller, Claude), teknik göstergeler, TradingView göstergeleri ve şirket finansallarından hesaplanan formüller kullanılır. <b>Yapay zekâ ve formüller yanılabilir</b>; yanlış, eksik ya da güncel olmayan sonuç verebilir.</li><li>Geçmiş getiri, gelecekteki getirinin göstergesi değildir. Hisse senetleri ve fonlar değer kaybedebilir; yatırdığınız paranın bir kısmını ya da tamamını kaybedebilirsiniz.</li><li>Yatırım kararlarınızı kendi araştırmanıza dayanarak ve gerekirse yetkili bir yatırım danışmanına başvurarak veriniz.</li></ul><h3>2. Verilerin doğruluğu ve sorumluluk reddi</h3><ul><li>Fiyatlar yaklaşık 15 dakika gecikmelidir ve üçüncü taraf kaynaklardan (Yahoo Finance, TradingView, TEFAS, Google Haberler) alınır. Bu kaynaklardaki hata, gecikme ya da kesintilerden uygulama sorumlu değildir.</li><li>Uygulama &quot;olduğu gibi&quot; sunulur. Uygulamanın geliştiricisi; uygulamadaki bilgilerin kullanılmasından ya da bu bilgilere dayanılarak verilen kararlardan doğabilecek doğrudan veya dolaylı hiçbir zarardan, kayıptan ya da kâr yoksunluğundan sorumlu tutulamaz.</li><li>Uygulama Borsa İstanbul, SPK, TEFAS, TradingView, Yahoo veya haberleri yayımlayan kuruluşlarla bağlantılı değildir ve onlar tarafından onaylanmamıştır. Haberlerin telif hakları ilgili yayıncılara aittir; uygulama yalnızca başlık ve bağlantı gösterir.</li><li>Uygulama alım satım işlemi yapmaz, para ya da hesap bilgisi istemez.</li></ul><h3>3. Gizlilik politikası</h3><p><b>Topladığımız kişisel veri yoktur.</b> Uygulamada üyelik, giriş, reklam ya da analiz (izleme) aracı bulunmaz.</p><ul><li><b>Telefonunuzda kalan bilgiler:</b> Favori hisseleriniz, takip ettiğiniz fonlar, ekran tercihleriniz, bu bilgilendirmeyi kabul ettiğiniz ve günlük analiz hakkınız yalnızca telefonunuzdaki uygulama depolamasında tutulur; bize gönderilmez. Uygulamayı silince bu bilgiler de silinir.</li><li><b>Veri indirme:</b> Uygulama piyasa verilerini ve güncellemeleri GitHub (github.com, raw.githubusercontent.com) üzerinden indirir. Her internet isteğinde olduğu gibi GitHub, IP adresiniz gibi teknik bilgileri kendi gizlilik politikasına göre işleyebilir.</li><li><b>&quot;Yapay zekâya analiz ettir&quot; düğmesi:</b> Bu düğmeye bastığınızda yalnızca hisse kodu (ör. &quot;THYAO&quot;) herkese açık ntfy.sh bildirim hizmetine gönderilir. Adınız, hesap ya da cihaz bilgisi gönderilmez; ancak ntfy.sh, IP adresinizi kendi politikasına göre işleyebilir. İstenen hissenin analizi herkes tarafından görülebilen ortak bir dosyaya kaydedilir.</li><li><b>Dış bağlantılar:</b> Haberler, TradingView ve TEFAS bağlantıları telefonunuzun tarayıcısında açılır; bu sitelerin kendi gizlilik politikaları geçerlidir.</li><li><b>Haklarınız (6698 sayılı KVKK):</b> Uygulama sizi tanımlayan bir veri tutmadığı için silinecek bir hesap yoktur. Telefonunuzdaki tüm uygulama verilerini (favoriler, onaylar, tercihler) istediğiniz an Ayarlar → Uygulamalar → Hisse Radar → Depolama → Verileri temizle ile ya da uygulamayı kaldırarak silebilirsiniz. Verdiğiniz onayı geri almak için de aynı yolu kullanabilir ve uygulamayı kullanmayı bırakabilirsiniz; bir sonraki açılışta onay yeniden sorulur.</li><li><b>İzinler:</b> Uygulama yalnızca internet erişimi ve bağlantı durumunu görme (internet var mı) izinlerini kullanır; konum, kişiler, kamera, mikrofon, dosyalar gibi izinler istemez.</li><li><b>Çocuklar:</b> Uygulama 18 yaş altındaki kişilere yönelik değildir.</li><li><b>Değişiklikler:</b> Bu metin güncellenebilir; önemli değişikliklerde uygulama açılışında yeniden onayınız istenir.</li></ul><h3>4. Telif hakları</h3><ul><li>Hisse Radar&#x27;ın yazılımı, tasarımı, metinleri, analiz kuralları ve ürettiği veriler <b>© 2026 Cem Ulaş Eren</b>&#x27;e aittir; tüm hakları saklıdır.</li><li>Uygulama ya da kodu izinsiz kopyalanamaz, değiştirilemez, başka bir yerde yayınlanamaz ve ticari amaçla kullanılamaz.</li><li>Uygulama yalnızca resmi APK&#x27;da ve resmi web adresinde (maj834.github.io/Hisse) çalışır.</li></ul><h3>5. İletişim</h3><p>Sorularınız ve talepleriniz için uygulamanın mağaza sayfasında yer alan geliştirici e-posta adresine yazabilirsiniz.</p></template>
