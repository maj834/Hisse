<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0F16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Borsa İstanbul hisseleri ve fonları için grafikler, yapay zekâ kararları, 1 hafta / 1 ay / 3 ay hedefler ve haberler.">
<title>Hisse Radar</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0A0F16;--s1:#111823;--s2:#172130;--s3:#1E2A3B;--line:#1F2B3C;
  --ink:#EAF0F7;--muted:#8B9AAE;--faint:#5C6C81;
  --blue:#4C8DFF;--blue-a:rgba(76,141,255,.14);
  --up:#22C38E;--up-a:rgba(34,195,142,.14);--down:#F4475C;--down-a:rgba(244,71,92,.14);--hold:#F2B53A;--hold-a:rgba(242,181,58,.14);
  --r:18px;--font:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums}
body{padding:0 0 calc(84px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
a{color:inherit}
p{margin:0}
h1,h2,h3{margin:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px}
.up{color:var(--up)}.down{color:var(--down)}.hold{color:var(--hold)}.muted{color:var(--muted)}.faint{color:var(--faint)}
.small{font-size:13px}.xs{font-size:12px}

/* üst çubuk */
.appbar{position:sticky;top:0;z-index:10;background:rgba(10,15,22,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding-top:env(safe-area-inset-top,0px)}
.appbar .in{display:flex;align-items:center;gap:12px;height:60px}
.appbar h1{font-size:19px;font-weight:800;letter-spacing:-.02em;flex:1}
.logo{width:30px;height:30px;border-radius:9px;background:var(--blue);display:grid;place-items:center;flex:none}
.live{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--muted);background:var(--s1);border:1px solid var(--line);padding:6px 11px;border-radius:999px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.live.on i{background:var(--up);animation:beat 2s infinite}
@keyframes beat{0%{box-shadow:0 0 0 0 rgba(34,195,142,.55)}70%{box-shadow:0 0 0 8px rgba(34,195,142,0)}100%{box-shadow:0 0 0 0 rgba(34,195,142,0)}}

/* genel */
.page{display:flex;flex-direction:column;gap:16px;padding-block:8px 24px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-h h2{font-size:17px;font-weight:700;letter-spacing:-.01em}
.label{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:4px 9px;border-radius:8px;white-space:nowrap}
.pill.up{background:var(--up-a)}.pill.down{background:var(--down-a)}.pill.hold{background:var(--hold-a)}.pill.n{background:var(--s3);color:var(--muted)}
.seg{display:flex;gap:4px;background:var(--s1);border:1px solid var(--line);padding:4px;border-radius:14px}
.seg button{flex:1;padding:9px 6px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--s3);color:var(--ink)}
.seg.sm button{padding:7px 4px;font-size:13px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:14px;font-weight:700;font-size:16px;padding:0 18px;text-decoration:none}
.btn.primary{background:var(--blue);color:#fff}
.btn.ghost{background:var(--s2);border:1px solid var(--line)}
.search{width:100%;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:13px 16px;font:inherit;color:var(--ink)}
.search::placeholder{color:var(--faint)}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--s3);gap:2px}
.bar i{display:block;height:100%}

/* piyasa özeti */
.sum-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sum-big{font-size:22px;font-weight:800;letter-spacing:-.02em}
.sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.sum-grid div{background:var(--s2);border-radius:12px;padding:10px 12px}
.sum-grid b{display:block;font-size:18px}

/* hisse listesi */
.list{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) 76px 108px;align-items:center;gap:12px;width:100%;padding:14px 16px;text-align:left;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row:active{background:var(--s2)}
.row .code{font-size:16px;font-weight:800;letter-spacing:.01em}
.row .name{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row svg{width:76px;height:30px;display:block}
.row .r{text-align:right}
.row .px{display:block;font-size:16px;font-weight:700}
.row .ch{display:inline-block;margin-top:3px;font-size:12px;font-weight:700;padding:2px 7px;border-radius:7px}
.ch.up{background:var(--up-a)}.ch.down{background:var(--down-a)}
.ai-dot{display:inline-block;margin-left:6px;font-size:10px;font-weight:800;padding:1px 6px;border-radius:6px;vertical-align:2px}

/* detay */
.dtop{display:flex;align-items:center;gap:8px;height:52px}
.back{display:flex;align-items:center;gap:4px;font-weight:700;color:var(--blue);padding:8px 8px 8px 0}
.dtop .sp{flex:1}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--s1);border:1px solid var(--line);display:grid;place-items:center;text-decoration:none}
.price-block .nm{font-size:14px;color:var(--muted)}
.price-block .big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.15;margin-top:2px}
.price-block .meta{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
.chart-card{padding:14px 12px 12px}
.chart-top{display:flex;gap:8px;align-items:center;padding-inline:4px}
.chart-top .seg{flex:1}
.modebtn{width:42px;height:42px;border-radius:12px;background:var(--s2);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.chart-wrap{position:relative;margin-top:12px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart-wrap svg{display:block;width:100%;height:auto}
.tip{position:absolute;top:0;transform:translateX(-50%);background:var(--s3);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:13px;font-weight:700;white-space:nowrap;pointer-events:none}
.tip span{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.chart-foot{display:flex;justify-content:space-between;gap:10px;padding:10px 4px 0;font-size:12px;color:var(--faint)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:10px 4px 0}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:3px}

/* yapay zekâ kararı */
.ask{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.verdict{display:flex;align-items:center;gap:16px;padding:16px;border-radius:14px;background:var(--s2)}
.verdict .v{font-size:30px;font-weight:800;letter-spacing:.02em;min-width:74px;text-align:center;padding:8px 12px;border-radius:12px}
.v.up{background:var(--up-a)}.v.down{background:var(--down-a)}.v.hold{background:var(--hold-a)}
.votes{display:flex;gap:6px;margin-top:6px}
.votes i{width:22px;height:6px;border-radius:3px;background:var(--s3)}
.models{display:flex;flex-direction:column;margin-top:6px}
.model{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line)}
.model:last-child{border-bottom:0;padding-bottom:0}
.av{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:15px;background:var(--s3)}
.model .mn{font-weight:700;font-size:15px}
.model .why{font-size:14px;color:var(--muted);margin-top:2px}
.model .rt{text-align:right}
.model .tg{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.note{font-size:12px;color:var(--faint);margin-top:12px}

/* hedef ölçeği */
.target-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.target-head b{font-size:26px;font-weight:800;letter-spacing:-.02em}
.scale{position:relative;height:66px;margin:20px 6px 4px}
.scale .track{position:absolute;left:0;right:0;top:30px;height:6px;border-radius:3px;background:var(--s3)}
.scale .range{position:absolute;top:30px;height:6px;border-radius:3px}
.scale .mk{position:absolute;top:22px;width:2px;height:22px;transform:translateX(-1px);border-radius:1px}
.scale .mk span{position:absolute;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;white-space:nowrap}
.scale .now span{top:-20px;color:var(--ink)}
.scale .tgt span{top:26px;color:var(--muted)}
.src-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.src-list div{display:flex;justify-content:space-between;gap:10px;font-size:14px}

/* seviyeler ve göstergeler */
.levels{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lv{background:var(--s2);border-radius:14px;padding:12px 14px;border-left:3px solid var(--line)}
.lv .k{font-size:12px;font-weight:700;color:var(--muted)}
.lv .val{font-size:18px;font-weight:800;margin-top:2px}
.lv .s{font-size:12px;color:var(--faint)}
.lv.buy{border-left-color:var(--blue)}.lv.stop{border-left-color:var(--down)}.lv.tgt{border-left-color:var(--up)}
.kv{display:flex;flex-direction:column}
.kv div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv div:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.kv b{font-weight:700;text-align:right}
.gauge{display:inline-block;width:70px;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--up) 0 30%,var(--s3) 30% 70%,var(--down) 70%);position:relative;margin-right:10px;vertical-align:2px}
.gauge i{position:absolute;top:-4px;width:3px;height:14px;border-radius:2px;background:var(--ink)}

/* haber */
.news{display:flex;flex-direction:column}
.nw{display:block;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none}
.nw:last-child{border-bottom:0}
.nw b{display:block;font-size:15px;font-weight:700;line-height:1.4}
.nw .m{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--muted)}
.tag{font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--blue-a);color:var(--blue)}
.kat{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--hold)}

/* beklenti */
.exp{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.exp .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.exp .code{font-size:17px;font-weight:800}
.exp .tgtline{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--s2);border-radius:12px;padding:10px 12px;font-size:14px}
.ev{padding:14px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0;padding-bottom:0}
.ev a{text-decoration:none}
.ev b{display:block;font-size:15px;line-height:1.4}
.impacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.imp{font-size:12px;font-weight:700;padding:4px 8px;border-radius:8px}
.imp.up{background:var(--up-a)}.imp.down{background:var(--down-a)}
.cons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cons>div{background:var(--s2);border-radius:14px;padding:12px}
.cons button{display:flex;justify-content:space-between;width:100%;padding:8px 0;font-size:14px;font-weight:700}

/* fon */
.fund{display:flex;flex-direction:column;gap:12px}

/* alt menü */
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(10,15,22,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 12px;font-size:12px;font-weight:600;color:var(--faint)}
nav button svg{width:24px;height:24px}
nav button[aria-selected="true"]{color:var(--ink)}
nav button[aria-selected="true"] svg{color:var(--blue)}
.flash .price-block .big,.flash .row .px{animation:fl 1.4s}
@keyframes fl{0%{color:var(--hold)}}
@media (prefers-reduced-motion:reduce){.live.on i,.flash .price-block .big,.flash .row .px{animation:none}}
.fin{display:flex;flex-direction:column;font-size:14px}
.fin>div{display:grid;grid-template-columns:minmax(0,1.4fr) 1fr .8fr .8fr;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.fin>div>*:not(:first-child){text-align:right}
.fin .fh{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding-top:0}
.fin span:first-child{color:var(--muted)}
.ratios{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.ratios div{background:var(--s2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.ratios span{font-size:12px;color:var(--muted)}.ratios b{font-size:17px}
.frow{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow .name{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.update{display:flex;flex-direction:column;gap:2px;margin-top:10px;padding:14px 16px;border-radius:14px;background:var(--blue);color:#fff;text-decoration:none}
.update span{font-size:13px;opacity:.9}
.star{color:var(--hold);margin-right:5px}
.favbtn{font-size:20px;color:var(--muted)}.favbtn.on{color:var(--hold)}
.nw.fav b{color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:999px;background:var(--s1);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--s3);color:var(--ink);border-color:var(--s3)}
.disc{font-size:12px;color:var(--faint);text-align:center;padding:8px 12px 0}
.disc a{color:var(--muted)}
/* açılış bilgilendirmesi */
.onay{position:fixed;inset:0;z-index:50;background:rgba(5,8,12,.94);display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.onay .kutu{width:100%;max-width:520px;max-height:100%;display:flex;flex-direction:column;gap:12px;background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:18px}
.onay h2{font-size:20px;font-weight:800}
.onay .yazi{overflow-y:auto;flex:1;min-height:120px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--muted);line-height:1.55}
.onay .yazi h2{font-size:16px;color:var(--ink);margin:0 0 8px}.onay .yazi h3{font-size:15px;color:var(--ink);margin:14px 0 6px}
.onay .yazi p{margin:0 0 8px}.onay .yazi ul{margin:0 0 8px;padding-left:18px}.onay .yazi li{margin-bottom:6px}.onay .yazi b{color:var(--ink)}
.onay label{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45}
.onay input[type=checkbox]{width:22px;height:22px;flex:none;margin:0;accent-color:var(--blue)}
.onay .btn[disabled]{opacity:.45}
body.kilit{overflow:hidden}
/* ================= animasyonlar ================= */
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes yukari{from{transform:translateY(12px);opacity:0}}
@keyframes solgun{from{opacity:0}}
@keyframes kay{from{transform:translateX(-100%)}to{transform:translateX(320%)}}
@keyframes cubuk{from{transform:scaleY(.08)}}
@keyframes ciz{to{stroke-dashoffset:0}}
@keyframes zipla{40%{transform:translateY(-5px)}70%{transform:translateY(1px)}}
@keyframes flUp{0%{background:rgba(34,195,142,.28)}100%{background:transparent}}
@keyframes flDn{0%{background:rgba(244,71,92,.28)}100%{background:transparent}}
@keyframes parilti{0%{background-position:-200px 0}100%{background-position:200px 0}}
/* açılış (giriş) ekranı */
.splash{position:fixed;inset:0;z-index:60;background:radial-gradient(120% 70% at 50% 35%,#13223A 0%,var(--bg) 60%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s ease,visibility .5s}
.splash.bitti{opacity:0;visibility:hidden;pointer-events:none}
.splash .lg{width:92px;height:92px;border-radius:28px;background:var(--blue);display:grid;place-items:center;box-shadow:0 20px 60px rgba(76,141,255,.4);animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
.splash .lg path{transform-box:fill-box;transform-origin:bottom;animation:cubuk .8s cubic-bezier(.3,1.4,.5,1) both}
.splash .lg path:nth-child(2){animation-delay:.12s}.splash .lg path:nth-child(3){animation-delay:.24s}.splash .lg path:nth-child(4){animation-delay:.36s}
.splash h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:8px;animation:yukari .6s .35s both}
.splash p{color:var(--muted);font-size:14px;animation:yukari .6s .5s both}
.splash .yuk{width:130px;height:3px;border-radius:2px;background:var(--s3);overflow:hidden;margin-top:18px;animation:solgun .4s .7s both}
.splash .yuk i{display:block;height:100%;width:35%;border-radius:2px;background:var(--blue);animation:kay 1.1s ease-in-out infinite}
.splash small{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));font-size:11px;color:var(--faint);animation:solgun .6s .8s both}
/* sayfa geçişi */
.page.giris{animation:yukari .35s cubic-bezier(.2,.8,.2,1)}
/* liste satırları kademeli gelir (yalnızca kullanıcı filtre/arama/sekme değiştirince) */
.anim>.row,.anim>.frow,.anim>.card>.frow,.anim>.exp{animation:yukari .42s cubic-bezier(.2,.8,.2,1) both}
.anim>*:nth-child(2){animation-delay:.03s}.anim>*:nth-child(3){animation-delay:.06s}.anim>*:nth-child(4){animation-delay:.09s}
.anim>*:nth-child(5){animation-delay:.12s}.anim>*:nth-child(6){animation-delay:.15s}.anim>*:nth-child(7){animation-delay:.18s}
.anim>*:nth-child(8){animation-delay:.21s}.anim>*:nth-child(9){animation-delay:.24s}.anim>*:nth-child(n+10){animation-delay:.27s}
/* grafik çizimi */
.ciz{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:ciz 1.1s cubic-bezier(.4,0,.2,1) forwards}
.alan{animation:solgun .9s .35s both}
.nokta{animation:pop .4s 1s both;transform-box:fill-box;transform-origin:center}
/* karar kartları */
.verdict .v{animation:pop .55s cubic-bezier(.2,1.4,.4,1) both}
.votes i{animation:pop .35s both}.votes i:nth-child(2){animation-delay:.05s}.votes i:nth-child(3){animation-delay:.1s}.votes i:nth-child(4){animation-delay:.15s}.votes i:nth-child(5){animation-delay:.2s}.votes i:nth-child(n+6){animation-delay:.25s}
.models .model{animation:yukari .4s both}.models .model:nth-child(2){animation-delay:.06s}.models .model:nth-child(3){animation-delay:.12s}.models .model:nth-child(n+4){animation-delay:.18s}

<template id="yasal-metin"><h2>Hisse Radar — Gizlilik Politikası ve Yasal Bilgilendirme</h2><p>Son güncelleme: 29 Eylül 2026</p><p>Hisse Radar, Borsa İstanbul hisseleri ve TEFAS yatırım fonları hakkında herkese açık piyasa verilerini, haber başlıklarını ve yapay zekâ ile formüllerle üretilmiş değerlendirmeleri gösteren ücretsiz bir mobil uygulamadır. Uygulamayı kullanarak aşağıdaki koşulları kabul etmiş olursunuz.</p><h3>1. Yatırım tavsiyesi değildir</h3><ul><li>Uygulamada yer alan AL / TUT / SAT kararları, hedef fiyatlar, beklenen getiriler, beklentiler, puanlar ve yorumlar <b>yatırım danışmanlığı kapsamında değildir</b> ve kimseye bir menkul kıymeti ya da fonu almayı, satmayı veya tutmayı tavsiye etmez.</li><li>Yatırım danışmanlığı hizmeti; aracı kurumlar, portföy yönetim şirketleri, mevduat kabul etmeyen bankalar ile müşteri arasında imzalanacak yatırım danışmanlığı sözleşmesi çerçevesinde sunulmaktadır. Burada yer alan yorum ve değerlendirmeler ise genel niteliktedir; mali durumunuz ile risk ve getiri tercihlerinize uygun olmayabilir. Bu nedenle, yalnızca burada yer alan bilgilere dayanılarak yatırım kararı verilmesi beklentilerinize uygun sonuçlar doğurmayabilir.</li><li>Değerlendirmeler otomatik olarak üretilir: yapay zekâ modelleri (ör. Groq üzerinden açık kaynak modeller, Claude), teknik göstergeler, TradingView göstergeleri ve şirket finansallarından hesaplanan formüller kullanılır. <b>Yapay zekâ ve formüller yanılabilir</b>; yanlış, eksik ya da güncel olmayan sonuç verebilir.</li><li>Geçmiş getiri, gelecekteki getirinin göstergesi değildir. Hisse senetleri ve fonlar değer kaybedebilir; yatırdığınız paranın bir kısmını ya da tamamını kaybedebilirsiniz.</li><li>Yatırım kararlarınızı kendi araştırmanıza dayanarak ve gerekirse yetkili bir yatırım danışmanına başvurarak veriniz.</li></ul><h3>2. Verilerin doğruluğu ve sorumluluk reddi</h3><ul><li>Fiyatlar yaklaşık 15 dakika gecikmelidir ve üçüncü taraf kaynaklardan (Yahoo Finance, TradingView, TEFAS, Google Haberler) alınır. Bu kaynaklardaki hata, gecikme ya da kesintilerden uygulama sorumlu değildir.</li><li>Uygulama &quot;olduğu gibi&quot; sunulur. Uygulamanın geliştiricisi; uygulamadaki bilgilerin kullanılmasından ya da bu bilgilere dayanılarak verilen kararlardan doğabilecek doğrudan veya dolaylı hiçbir zarardan, kayıptan ya da kâr yoksunluğundan sorumlu tutulamaz.</li><li>Uygulama Borsa İstanbul, SPK, TEFAS, TradingView, Yahoo veya haberleri yayımlayan kuruluşlarla bağlantılı değildir ve onlar tarafından onaylanmamıştır. Haberlerin telif hakları ilgili yayıncılara aittir; uygulama yalnızca başlık ve bağlantı gösterir.</li><li>Uygulama alım satım işlemi yapmaz, para ya da hesap bilgisi istemez.</li></ul><h3>3. Gizlilik politikası</h3><p><b>Topladığımız kişisel veri yoktur.</b> Uygulamada üyelik, giriş, reklam ya da analiz (izleme) aracı bulunmaz.</p><ul><li><b>Telefonunuzda kalan bilgiler:</b> Favori hisseleriniz, takip ettiğiniz fonlar, ekran tercihleriniz, bu bilgilendirmeyi kabul ettiğiniz ve günlük analiz hakkınız yalnızca telefonunuzdaki uygulama depolamasında tutulur; bize gönderilmez. Uygulamayı silince bu bilgiler de silinir.</li><li><b>Veri indirme:</b> Uygulama piyasa verilerini ve güncellemeleri GitHub (github.com, raw.githubusercontent.com) üzerinden indirir. Her internet isteğinde olduğu gibi GitHub, IP adresiniz gibi teknik bilgileri kendi gizlilik politikasına göre işleyebilir.</li><li><b>&quot;Yapay zekâya analiz ettir&quot; düğmesi:</b> Bu düğmeye bastığınızda yalnızca hisse kodu (ör. &quot;THYAO&quot;) herkese açık ntfy.sh bildirim hizmetine gönderilir. Adınız, hesap ya da cihaz bilgisi gönderilmez; ancak ntfy.sh, IP adresinizi kendi politikasına göre işleyebilir. İstenen hissenin analizi herkes tarafından görülebilen ortak bir dosyaya kaydedilir.</li><li><b>Dış bağlantılar:</b> Haberler, TradingView ve TEFAS bağlantıları telefonunuzun tarayıcısında açılır; bu sitelerin kendi gizlilik politikaları geçerlidir.</li><li><b>Haklarınız (6698 sayılı KVKK):</b> Uygulama sizi tanımlayan bir veri tutmadığı için silinecek bir hesap yoktur. Telefonunuzdaki tüm uygulama verilerini (favoriler, onaylar, tercihler) istediğiniz an Ayarlar → Uygulamalar → Hisse Radar → Depolama → Verileri temizle ile ya da uygulamayı kaldırarak silebilirsiniz. Verdiğiniz onayı geri almak için de aynı yolu kullanabilir ve uygulamayı kullanmayı bırakabilirsiniz; bir sonraki açılışta onay yeniden sorulur.</li><li><b>İzinler:</b> Uygulama yalnızca internet erişimi ve bağlantı durumunu görme (internet var mı) izinlerini kullanır; konum, kişiler, kamera, mikrofon, dosyalar gibi izinler istemez.</li><li><b>Çocuklar:</b> Uygulama 18 yaş altındaki kişilere yönelik değildir.</li><li><b>Değişiklikler:</b> Bu metin güncellenebilir; önemli değişikliklerde uygulama açılışında yeniden onayınız istenir.</li></ul><h3>4. İletişim</h3><p>Sorularınız ve talepleriniz için uygulamanın mağaza sayfasında yer alan geliştirici e-posta adresine yazabilirsiniz.</p></template>

const sma=(a,n)=>{a=a.slice(-n);return a.reduce((s,v)=>s+v,0)/(a.length||1)};

// Ortak karar: düşük güvenli oy yarım sayılır; AL/SAT için ağırlığın en az %60'ı ve en az 2 kaynak gerekir, yoksa TUT
function consensus(list){

/* istek üzerine yapay zekâ analizi (BIST 30 dışı): ntfy.sh üzerinden istek gönderilir, GitHub Actions değerlendirir */

function hisseKarar(k,vs){const a=getA(k),c=consensus(vs||votes(k));if(!a||HZ!=="1h")return c;const r=(MK[k]&&MK[k].rsi!=null)?MK[k].rsi:a.noHist?null:a.R;

}
function smoothPath(P){ // monotone kübik
  const n=P.length;if(n<2)return "";if(n===2)return `M${P[0][0]},${P[0][1]}L${P[1][0]},${P[1][1]}`;
  const dx=[],dy=[],m=[],t=[];
  for(let i=0;i<n-1;i++){dx[i]=P[i+1][0]-P[i][0];dy[i]=P[i+1][1]-P[i][1];m[i]=dy[i]/(dx[i]||1e-9)}
  t[0]=m[0];t[n-1]=m[n-2];for(let i=1;i<n-1;i++)t[i]=m[i-1]*m[i]<=0?0:(m[i-1]+m[i])/2;
  for(let i=0;i<n-1;i++){if(m[i]===0){t[i]=t[i+1]=0;continue}const a=t[i]/m[i],b=t[i+1]/m[i],h=a*a+b*b;if(h>9){const s=3/Math.sqrt(h);t[i]=s*a*m[i];t[i+1]=s*b*m[i]}}
  let d=`M${P[0][0].toFixed(1)},${P[0][1].toFixed(1)}`;
  for(let i=0;i<n-1;i++){const h=dx[i]/3;d+=`C${(P[i][0]+h).toFixed(1)},${(P[i][1]+h*t[i]).toFixed(1)} ${(P[i+1][0]-h).toFixed(1)},${(P[i+1][1]-h*t[i+1]).toFixed(1)} ${P[i+1][0].toFixed(1)},${P[i+1][1].toFixed(1)}`}
  return d;
}
function drawChart(){

  const {pts,base,baseLbl}=seriesFor(a);
  const W=360,H=mode==="mum"?250:220,L=4,R=44,Tp=16,B=mode==="mum"?60:14;

function fmtTime(iso){const t=T(iso);if(!t)return "";const d=new Date(t);return d.toLocaleDateString("tr-TR",{day:"numeric",month:"short"})+" "+d.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})+" analizi"}

const ALIAS={AEFES:["EFES"],AKBNK:["AKBANK"],ASELS:["ASELSAN"],BIMAS:["BİM"],EKGYO:["EMLAK KONUT"],ENKAI:["ENKA"],EREGL:["ERDEMİR","EREĞLİ"],FROTO:["FORD OTOSAN"],GARAN:["GARANTİ"],GUBRF:["GÜBRETAŞ"],ISCTR:["İŞ BANKASI","İŞBANK"],KCHOL:["KOÇ HOLDİNG"],TRALT:["KOZA","TÜRK ALTIN"],KRDMD:["KARDEMİR"],MGROS:["MİGROS"],PETKM:["PETKİM"],SAHOL:["SABANCI"],SASA:["SASA"],SISE:["ŞİŞECAM"],TAVHL:["TAV"],TCELL:["TURKCELL"],THYAO:["THY","TÜRK HAVA YOLLARI"],TOASO:["TOFAŞ"],TTKOM:["TÜRK TELEKOM"],TUPRS:["TÜPRAŞ"],VAKBN:["VAKIFBANK"],YKBNK:["YAPI KREDİ"],PGSUS:["PEGASUS"],ASTOR:["ASTOR"],DSTKF:["DESTEK FAKTORİNG","DESTEK FİNANS"]};
const up=s=>" "+String(s).toLocaleUpperCase("tr").replace(/[^A-ZÇĞİÖŞÜ0-9&]+/g," ")+" ";
function hits(title,n){const t=up(title);const r=ALL.filter(a=>[a.k,...(ALIAS[a.k]||[])].some(w=>t.includes(" "+w+" "))).map(a=>a.k);if(n&&n.sym&&BY[n.sym]&&!r.includes(n.sym))r.unshift(n.sym);return r}
function newsFor(k){return (NEWS.items||[]).filter(n=>hits(n.title,n).includes(k))}
// Fonun adı/türünden ilgili haber konuları
const KONU=[[/PETROL|ENERJİ/,["PETROL","BRENT","OPEC","ENERJİ"]],[/ALTIN|KIYMETLİ MADEN/,["ALTIN","ONS"]],[/GÜMÜŞ|KIYMETLİ MADEN/,["GÜMÜŞ"]],
  [/TEKNOLOJİ|BİLİŞİM/,["TEKNOLOJİ","YAPAY ZEKA","NASDAQ","ÇİP"]],[/YABANCI|ABD|GLOBAL|DÜNYA/,["NASDAQ","S&P","ABD","FED","WALL STREET"]],
  [/HİSSE|BIST|ENDEKS/,["BORSA İSTANBUL","BIST","BORSA"]],[/PARA PİYASASI|BORÇLANMA|KİRA SERTİFİKA|KATILIM|TAHVİL|BONO/,["FAİZ","TCMB","MERKEZ BANKASI","ENFLASYON"]],
  [/EUROBOND|DÖVİZ|DOLAR|EURO/,["DOLAR","EURO","KUR"]],[/BANKA/,["BANKA"]],[/SAVUNMA/,["SAVUNMA","ASELSAN"]]];
function fundTopics(f){const s=up((f.ad||"")+" "+(f.tur||"")+" "+(f.kategori||""));const w=new Set();KONU.forEach(([re,ks])=>{if(re.test(s))ks.forEach(k=>w.add(k))});if(!w.size)["FON","BORSA"].forEach(k=>w.add(k));return [...w]}
function newsForFund(k){const f=fInfo(k),ws=fundTopics(f);return (NEWS.items||[]).filter(n=>{const t=up(n.title);return t.includes(" "+k+" ")||ws.some(w=>t.includes(" "+w+" ")||(w.length>5&&t.includes(w)))})}
const GENEL=new Set(["BORSA","BORSA İSTANBUL","BIST","FON","ABD","FED","S&P","WALL STREET"]);
function favNews(n){const h=hits(n.title,n).filter(isFav);const t=up(n.title);const fs=(typeof myF!=="undefined"&&myF?myF:[]).filter(k=>t.includes(" "+k+" ")||fundTopics(fInfo(k)).filter(w=>!GENEL.has(w)).some(w=>t.includes(" "+w+" ")));return [...h,...fs]}
function ago(n){if(n.ts){const m=Math.round((Date.now()/1000-n.ts)/60);if(m<60)return m+" dk önce";if(m<1440)return Math.floor(m/60)+" sa önce";}return n.t||""}
function newsRow(n,fv){const h=hits(n.title,n);fv=fv||[];return `<a class="nw${fv.length?" fav":""}" href="${esc(n.url)}" target="_blank" rel="noopener"><b>${fv.length?`<span class="star">★</span>`:""}${esc(n.title)}</b><span class="m">${n.kat?`<span class="kat">${esc(n.kat)}</span>`:""}<span>${esc(n.kaynak||"")}</span><span>${esc(ago(n))}</span>${h.map(k=>`<span class="tag">${k}</span>`).join("")}</span></a>`}
let nf2=store.get("nf","all");
function renderNews(){
  const kats=["all","fav",...new Set((NEWS.items||[]).map(n=>n.kat).filter(Boolean))];
  const all=(NEWS.items||[]).map(n=>({n,fv:favNews(n)}));

  $("#p-haber").innerHTML=`<div class="chips" id="nf">${kats.map(k=>`<button class="chip" data-n="${esc(k)}" aria-pressed="${k===nf2}">${k==="all"?"Tümü":k==="fav"?"★ Favorilerim":esc(k)}</button>`).join("")}</div>
  ${favs.length?`<div class="card" style="padding-block:4px"><div class="card-h" style="margin:12px 0 0"><h2 style="font-size:15px">★ Favorilerini ilgilendiren</h2><span class="xs muted">${favs.length} haber</span></div><div class="news">${favs.map(o=>newsRow(o.n,o.fv)).join("")}</div></div>`:""}
  <div class="card" style="padding-block:4px"><div class="news">${rest.map(o=>newsRow(o.n,o.fv)).join("")||`<p class="muted" style="padding:14px 0">${nf2==="fav"?"Favori hisse ya da takip ettiğin fonlarla ilgili haber yok. Hisse sayfasındaki ☆ ile favori ekleyebilirsin.":"Bu kategoride haber yok."}</p>`}</div></div>`;
  $("#nf").onclick=e=>{const b=e.target.closest("[data-n]");if(!b)return;nf2=b.dataset.n;store.set("nf",nf2);renderNews()};

  <div class="price-block"><div class="nm">${esc(k)} · ${esc(f.tur||f.kategori||"Yatırım fonu")}</div>
    <div class="big" style="font-size:${f.fiyat?34:26}px">${f.fiyat?nf(f.fiyat,4)+` <span style="font-size:17px" class="muted">TL</span>`:esc(k)}</div>
    <div class="meta">${f.gunluk!=null?`<span class="pill ${cls(f.gunluk)} ${cls(f.gunluk)}">${pct(f.gunluk)}</span>`:""}<span class="small muted">${esc(f.ad||"")}</span></div></div>
  ${chart?`<div class="card chart-card">${chart}</div>`:""}
  ${fundAICard(k)}
  <button class="btn ${on?"ghost":"primary"}" id="ftrack">${on?"Takipten çıkar":"Takip et"}</button>
  <div class="card"><div class="card-h"><h2>Getiriler</h2></div>
    <div class="ratios" style="margin:0;grid-template-columns:repeat(3,1fr)">${[["1 ay",g.g1a],["3 ay",g.g3a],["6 ay",g.g6a],["Yılbaşından",g.gyb],["1 yıl",g.g1y],["3 yıl",g.g3y]].map(([l,v])=>`<div><span>${l}</span><b>${gp(v)}</b></div>`).join("")}</div></div>
  ${f.buyukluk||f.yatirimci||f.r?`<div class="card"><div class="kv">${f.buyukluk?`<div><span>Fon büyüklüğü</span><b>${mr(f.buyukluk)} TL</b></div>`:""}${f.yatirimci?`<div><span>Yatırımcı</span><b>${Number(f.yatirimci).toLocaleString("tr-TR")}</b></div>`:""}${f.r?`<div><span>Risk değeri (1-7)</span><b>${esc(f.r)}</b></div>`:""}${f.siralama&&f.kategoriSayi?`<div><span>Kategorisinde sırası</span><b>${esc(f.siralama)} / ${esc(f.kategoriSayi)}</b></div>`:""}</div></div>`:""}
  ${s.length>2?"":`<p class="small muted" style="text-align:center">Bu fonun fiyat grafiği henüz yok. Grafikler en çok kazandıran 150 fon ve takip listesi için çekiliyor.</p>`}
  ${(()=>{const nw=newsForFund(k).slice(0,6);return nw.length?`<div class="card"><div class="card-h"><h2>Bu fonu etkileyebilecek haberler</h2></div><p class="xs muted" style="margin:-6px 0 6px">Konular: ${fundTopics(f).map(w=>w.toLocaleLowerCase("tr")).join(", ")}</p><div class="news">${nw.map(n=>newsRow(n)).join("")}</div></div>`:""})()}
  <a class="btn ghost" href="https://www.tefas.gov.tr/FonAnaliz.aspx?FonKod=${encodeURIComponent(k)}" target="_blank" rel="noopener">TEFAS'ta aç</a>
  <p class="disc">Geçmiş getiri gelecekteki getiriyi göstermez. Yatırım tavsiyesi değildir.</p>`;
  $("#fback").onclick=goBack;
  $("#ftrack").onclick=()=>{myF=myF.includes(k)?myF.filter(x=>x!==k):[...myF,k];store.set("funds2",myF);renderFunds();openFund(k,true)};
  setView("fondetay");if(!noPush){nav({v:"fondetay",k});window.scrollTo(0,0)}
}

/* ================= gezinme (telefonun geri tuşu uygulamadan atmaz) ================= */
const VIEWS=["piyasa","detay","beklenti","haber","fon","fondetay"];
function setView(v){VIEWS.forEach(n=>{const el=$("#p-"+n),once=el.hidden;el.hidden=n!==v;if(n===v&&once){el.classList.remove("giris");void el.offsetWidth;el.classList.add("giris")}});const tb=v==="detay"?"piyasa":v==="fondetay"?"fon":v;document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tb))}
function nav(st){try{history.pushState(st,"","#"+(st.k||st.v))}catch(e){}}
function goBack(){if(history.state&&history.state.v&&history.state.v!=="piyasa")history.back();else showTab("piyasa",true)}
function showTab(t,noPush){tab=t;cur=null;setView(t);window.scrollTo(0,0);if(!noPush){if(t==="piyasa"){try{history.replaceState({v:"piyasa"},"","#piyasa")}catch(e){}}else nav({v:t})}}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{if(!$("#p-"+b.dataset.tab).hidden)return;showTab(b.dataset.tab)});
window.addEventListener("popstate",e=>{const s=e.state||{v:"piyasa"};if(s.v==="detay"&&getA(s.k))openDetail(s.k,false,true);else if(s.v==="fondetay"&&s.k)openFund(s.k,true);else showTab(VIEWS.includes(s.v)?s.v:"piyasa",true)});
// Android'in geri tuşu için: true = uygulama içinde geri gidildi
window.hrBack=function(){const o=$("#onay");if(o&&$("#onayKapat")){o.remove();document.body.classList.remove("kilit");return true}if(o)return false;const s=history.state;if(s&&s.v&&s.v!=="piyasa"){history.back();return true}if($("#p-piyasa").hidden){showTab("piyasa",true);return true}return false};

/* ================= açılış bilgilendirmesi: yatırım tavsiyesi değildir + gizlilik ================= */
// Metin değişirse ONAY_SURUM artırılır; herkesten yeniden onay istenir
const ONAY_SURUM="2026-09-29";
function onayGoster(okuma){
  if(!okuma&&store.get("onay","")===ONAY_SURUM)return;
  const d=document.createElement("div");d.className="onay";d.id="onay";d.setAttribute("role","dialog");d.setAttribute("aria-modal","true");
  d.innerHTML=`<div class="kutu">
    <h2>${okuma?"Gizlilik ve yasal bilgilendirme":"Hisse Radar'a hoş geldin"}</h2>
    ${okuma?"":`<p class="small">Devam etmeden önce lütfen oku: bu uygulamadaki <b>AL / TUT / SAT kararları, hedefler ve yorumlar yatırım tavsiyesi değildir</b>; yapay zekâ ve formüllerle otomatik üretilir ve yanılabilir. Fiyatlar yaklaşık 15 dakika gecikmelidir.</p>`}
    <div class="yazi">${document.getElementById("yasal-metin").innerHTML}</div>
    ${okuma?`<button class="btn primary" id="onayKapat">Kapat</button>`:`
    <label><input type="checkbox" id="onay1"> Buradaki bilgilerin yatırım danışmanlığı ya da yatırım tavsiyesi olmadığını, yatırım kararlarımın ve sonuçlarının sorumluluğunun tamamen bana ait olduğunu okudum ve kabul ediyorum.</label>
    <label><input type="checkbox" id="onay2"> Gizlilik politikasını okudum ve kabul ediyorum. 18 yaşından büyüğüm.</label>
    <button class="btn primary" id="onayBtn" disabled>Kabul et ve devam et</button>`}
  </div>`;
  document.body.appendChild(d);document.body.classList.add("kilit");
  const kapat=()=>{d.remove();document.body.classList.remove("kilit")};
  if(okuma){$("#onayKapat").onclick=kapat;return}
  const kontrol=()=>{$("#onayBtn").disabled=!($("#onay1").checked&&$("#onay2").checked)};
  $("#onay1").onchange=kontrol;$("#onay2").onchange=kontrol;
  $("#onayBtn").onclick=()=>{store.set("onay",ONAY_SURUM);store.set("onayZaman",new Date().toISOString());kapat()};
}
document.addEventListener("click",e=>{const a=e.target.closest("[data-yasal]");if(a){e.preventDefault();onayGoster(true)}});

/* ================= yeni sürüm uyarısı ================= */
// Tasarım değişiklikleri APK'sız gelir; uyarı yalnızca uygulamanın kendisi (android/) değiştiğinde gerekir.
// APK_MIN: kurulu olması gereken en düşük sürüm. Android kodu değişince bu sayı yeni sürüme çekilir.
const APK_MIN=9;
(function(){const m=navigator.userAgent.match(/HisseRadarApp\/(\d+)/);if(!m)return;const mine=+m[1];if(mine>=APK_MIN)return;
  fetch("https://api.github.com/repos/maj834/Hisse/releases/latest",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(d=>{if(!d)return;const n=+((d.tag_name||"").split(".").pop()||0);if(n>mine){const b=document.createElement("a");b.className="update";b.href="https://github.com/maj834/Hisse/releases/latest";b.innerHTML=`<b>Yeni güncelleme var · 1.${n}</b><span>Dokun, güncelleme sayfasında HisseRadar.apk'yı indirip kur. Favorilerin silinmez.</span>`;document.querySelector("main").prepend(b)}}).catch(()=>{})})();

/* ================= canlılık ================= */
function isOpen(){const n=new Date(),d=n.getUTCDay(),m=n.getUTCHours()*60+n.getUTCMinutes();return d>=1&&d<=5&&m>=420&&m<=915}
function updateLive(){const t=T(SNAP.updatedAt),age=(Date.now()-t)/6e4,on=t&&age<6&&isOpen();$("#live").classList.toggle("on",!!on);
  const lt=(SNAP.guncelleme||"").split(", ").pop();$("#liveTxt").textContent=on?"Canlı · "+lt:isOpen()?"Veri "+lt:"Kapanış "+lt}
function renderAll(){rebuild();if($("#q")&&$("#idx")){$("#idx").innerHTML=idxCard();drawIdx();renderRows()}else renderMarket();renderOutlook();renderNews();renderFunds();updateLive();FKC={};if(cur&&!$("#p-detay").hidden)openDetail(cur.k,true);if(curF&&!$("#p-fondetay").hidden)openFund(curF,true)}
function flash(){document.body.classList.add("flash");setTimeout(()=>document.body.classList.remove("flash"),1500)}

/* ================= veri: 5 saniyede bir ================= */
async function getJ(u){const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw new Error(r.status);return r.json()}
let busy=false;
async function poll(){if(busy||document.hidden)return;busy=true;try{const d=await getJ(RAW("data","snapshot.json"));if(d.hisseler&&T(d.updatedAt)>T(SNAP.updatedAt)){SNAP=d;renderAll();flash()}}catch(e){}busy=false;updateLive()}
async function pollMarket(){try{const d=await getJ(RAW("data","market.json"));if(d.hisseler&&T(d.updatedAt)>T(MKD.updatedAt)){const ilk=!MKL.length;setMarket(d);if(ilk)renderMarket();else renderRows();if(cur&&cur.lite&&!$("#p-detay").hidden)openDetail(cur.k,true)}}catch(e){}}
async function pollSlow(){
  pollMarket();loadGec();
  try{const d=await getJ(RAW("data","news.json"));if(d.items&&T(d.updatedAt)>T(NEWS.updatedAt)){NEWS=d;renderNews()}}catch(e){}
  try{const d=await getJ(RAW("main","data/outlook.json"));if(T(d.updatedAt)>T(OUT.updatedAt)){OUT=d;renderAll()}}catch(e){}
  try{const d=await getJ(RAW("main","data/ai.json"));if(T(d.updatedAt)>T(AI.updatedAt)){AI=d;renderAll()}}catch(e){}
  try{const d=await getJ(RAW("main","data/temel.json"));if(T(d.updatedAt)>T(TEMEL.updatedAt)){TEMEL=d;renderAll()}}catch(e){}
  try{const d=await getJ(RAW("main","data/gundem.json"));if(T(d.updatedAt)>T(GUN.updatedAt)){GUN=d;renderOutlook()}}catch(e){}
  try{const d=await getJ(RAW("main","data/ai_genis.json"));if(T(d.updatedAt)>T(AIG.updatedAt)){AIG=d;KC={};renderRows();if(cur&&cur.lite&&!$("#p-detay").hidden)openDetail(cur.k,true)}}catch(e){}
  try{const d=await getJ(RAW("main","data/fon_ai.json"));if(T(d.updatedAt)>T(FAI.updatedAt)){FAI=d;FKC={};renderFunds();if(curF&&!$("#p-fondetay").hidden)openFund(curF,true)}}catch(e){}
  if(Date.now()-lastFunds>6e5){lastFunds=Date.now();try{const d=await getJ(RAW("data","funds.json"));if(T(d.updatedAt)>T(FUNDS.updatedAt)){FUNDS=d;renderFunds();if(curF&&!$("#p-fondetay").hidden)openFund(curF,true)}}catch(e){}}
}
let lastFunds=0;
renderAll();talepIzle();
// giriş ekranı: en az ~1,3 sn görünür, sonra kaybolur; ardından (gerekirse) yasal onay açılır
(function(){const sp=$("#splash"),hazir=()=>{sp.classList.add("bitti");setTimeout(()=>{sp.remove();onayGoster(false)},520)};
  const az=matchMedia("(prefers-reduced-motion:reduce)").matches?200:1300;setTimeout(hazir,az)})();
const h=location.hash.slice(1);try{history.replaceState({v:"piyasa"},"","#piyasa")}catch(e){}
if(["beklenti","haber","fon"].includes(h))showTab(h);else if(getA(h.toUpperCase()))openDetail(h.toUpperCase());
poll();pollSlow();
setInterval(poll,5000);setInterval(pollSlow,60000);setInterval(updateLive,15000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){poll();pollSlow()}});
})();
</script>
</body>
</html>
